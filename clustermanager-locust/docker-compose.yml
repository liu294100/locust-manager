version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: locust-manager-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: locust_manager
      MYSQL_USER: locust
      MYSQL_PASSWORD: locust123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - locust-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: locust-manager-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - locust-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Locust Manager应用
  locust-manager:
    build: .
    container_name: locust-manager-app
    environment:
      # Flask配置
      FLASK_ENV: production
      FLASK_DEBUG: "false"
      SECRET_KEY: "your-secret-key-change-this-in-production"
      
      # 数据库配置
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: locust
      MYSQL_PASSWORD: locust123
      MYSQL_DATABASE: locust_manager
      
      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      
      # 集群配置
      CLUSTER_ENABLED: "true"
      NODE_NAME: "locust-manager-node-1"
      
      # 文件上传配置
      UPLOAD_FOLDER: "/app/uploads"
      MAX_CONTENT_LENGTH: "16777216"
      
      # AWS S3配置（可选）
      AWS_S3_ENABLED: "false"
      AWS_S3_BUCKET: ""
      AWS_S3_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      
      # 其他配置
      RESULTS_PER_PAGE: 20
      SESSION_TIMEOUT: 3600
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
      - scripts_data:/app/scripts
      - logs_data:/app/logs
    networks:
      - locust-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: locust-manager-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL证书目录（如果使用HTTPS）
    networks:
      - locust-network
    depends_on:
      - locust-manager
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  scripts_data:
    driver: local
  logs_data:
    driver: local

networks:
  locust-network:
    driver: bridge