version: "3.8"

services:
  # ============ 单节点模式 ============
  locust:
    build:
      context: .
      args:
        - PIP_INDEX_URL=${PIP_INDEX_URL}
    image: locust-cluster-manager:latest
    environment:
      - LOCUST_FILE=${LOCUST_FILE:-demo_locust.py}
      - TARGET_HOST=${TARGET_HOST}
      # Nacos 配置（可选覆盖，默认使用程序内置地址 localhost:8848）
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - NACOS_GROUP=${NACOS_GROUP:-DEFAULT_GROUP}
      - NACOS_DATA_ID=${NACOS_DATA_ID:-locust-platform-config}
      # 节点标识（可选，不设置则自动生成）
      - NODE_ID=${NODE_ID:-}
    ports:
      - "8088:8088"  # Flask management UI
      - "8089-8099:8089-8099"  # Locust web UI (多实例)
      - "5557-5567:5557-5567"  # Locust master 通信端口
    volumes:
      - ./scripts:/app/scripts
      - ./logs:/app/logs
    command: python app.py
    profiles:
      - single

  # ============ 集群模式 - 节点 1 ============
  # 节点角色由自动选举决定，第一个启动的节点成为 Master
  locust-node-1:
    build:
      context: .
      args:
        - PIP_INDEX_URL=${PIP_INDEX_URL}
    image: locust-cluster-manager:latest
    environment:
      - TARGET_HOST=${TARGET_HOST}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - NACOS_GROUP=${NACOS_GROUP:-DEFAULT_GROUP}
      - NACOS_DATA_ID=${NACOS_DATA_ID:-locust-platform-config}
      - NODE_ID=locust-node-1
    ports:
      - "8088:8088"
      - "8089-8099:8089-8099"
      - "5557-5567:5557-5567"
    volumes:
      - ./scripts:/app/scripts
      - ./logs:/app/logs
    command: python app.py
    profiles:
      - cluster
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ============ 集群模式 - 节点 2 ============
  locust-node-2:
    build:
      context: .
      args:
        - PIP_INDEX_URL=${PIP_INDEX_URL}
    image: locust-cluster-manager:latest
    environment:
      - TARGET_HOST=${TARGET_HOST}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - NACOS_GROUP=${NACOS_GROUP:-DEFAULT_GROUP}
      - NACOS_DATA_ID=${NACOS_DATA_ID:-locust-platform-config}
      - NODE_ID=locust-node-2
    ports:
      - "8188:8088"
      - "8189-8199:8089-8099"
    volumes:
      - ./scripts:/app/scripts
      - ./logs:/app/logs
    command: python app.py
    profiles:
      - cluster
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ============ 集群模式 - 节点 3 ============
  locust-node-3:
    build:
      context: .
      args:
        - PIP_INDEX_URL=${PIP_INDEX_URL}
    image: locust-cluster-manager:latest
    environment:
      - TARGET_HOST=${TARGET_HOST}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - NACOS_GROUP=${NACOS_GROUP:-DEFAULT_GROUP}
      - NACOS_DATA_ID=${NACOS_DATA_ID:-locust-platform-config}
      - NODE_ID=locust-node-3
    ports:
      - "8288:8088"
      - "8289-8299:8089-8099"
    volumes:
      - ./scripts:/app/scripts
      - ./logs:/app/logs
    command: python app.py
    profiles:
      - cluster
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ============ 集群模式 - 节点 4 ============
  locust-node-4:
    build:
      context: .
      args:
        - PIP_INDEX_URL=${PIP_INDEX_URL}
    image: locust-cluster-manager:latest
    environment:
      - TARGET_HOST=${TARGET_HOST}
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - NACOS_GROUP=${NACOS_GROUP:-DEFAULT_GROUP}
      - NACOS_DATA_ID=${NACOS_DATA_ID:-locust-platform-config}
      - NODE_ID=locust-node-4
    ports:
      - "8388:8088"
      - "8389-8399:8089-8099"
    volumes:
      - ./scripts:/app/scripts
      - ./logs:/app/logs
    command: python app.py
    profiles:
      - cluster
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

# 使用方法:
# 单节点模式: docker-compose --profile single up -d
# 集群模式:   docker-compose --profile cluster up -d
#
# 所有配置统一在 Nacos 中管理:
# - Nacos 地址: http://localhost:8848
# - DataId: locust-platform-config
#
# 自动选主机制:
# - 第一个启动的节点自动成为 Master
# - Master 故障后（15秒无心跳），其他节点自动竞选新 Master
# - 无需手动配置节点角色
