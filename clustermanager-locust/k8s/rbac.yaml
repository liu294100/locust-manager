apiVersion: v1
kind: ServiceAccount
metadata:
  name: locust-manager
  namespace: locust-manager
  labels:
    app: locust-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: locust-manager-role
  labels:
    app: locust-manager
rules:
# 读取节点信息用于集群监控
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
# 读取Pod信息用于实例管理
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete"]
# 读取服务信息
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
# 读取配置映射
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
# 读取密钥
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
# 读取事件
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: locust-manager-binding
  labels:
    app: locust-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: locust-manager-role
subjects:
- kind: ServiceAccount
  name: locust-manager
  namespace: locust-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: locust-manager-namespace-role
  namespace: locust-manager
  labels:
    app: locust-manager
rules:
# 管理Pod（用于Locust实例）
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# 管理服务
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# 管理配置映射
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# 读取密钥
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
# 管理持久卷声明
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: locust-manager-namespace-binding
  namespace: locust-manager
  labels:
    app: locust-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: locust-manager-namespace-role
subjects:
- kind: ServiceAccount
  name: locust-manager
  namespace: locust-manager