apiVersion: v1
kind: Service
metadata:
  name: locust-manager-service
  namespace: locust-manager
  labels:
    app: locust-manager
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: locust-manager
---
apiVersion: v1
kind: Service
metadata:
  name: locust-manager-headless
  namespace: locust-manager
  labels:
    app: locust-manager
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: locust-manager
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: locust-manager-ingress
  namespace: locust-manager
  labels:
    app: locust-manager
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # 如果使用HTTPS，取消注释以下行
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  # 如果使用HTTPS，取消注释以下部分
  # tls:
  # - hosts:
  #   - locust-manager.yourdomain.com
  #   secretName: locust-manager-tls
  rules:
  - host: locust-manager.local  # 请更改为您的域名
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: locust-manager-service
            port:
              number: 80
---
# 如果需要NodePort访问，可以使用以下配置
apiVersion: v1
kind: Service
metadata:
  name: locust-manager-nodeport
  namespace: locust-manager
  labels:
    app: locust-manager
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
    nodePort: 30080  # 可以指定端口，或让K8s自动分配
  selector:
    app: locust-manager