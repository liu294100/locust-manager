apiVersion: v1
kind: PersistentVolume
metadata:
  name: locust-manager-uploads-pv
  labels:
    app: locust-manager
    type: uploads
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: locust-manager-storage
  # 使用NFS存储（推荐用于多副本部署）
  nfs:
    server: your-nfs-server.local  # 请更改为您的NFS服务器地址
    path: /data/locust-manager/uploads
  # 或者使用hostPath（仅适用于单节点或测试环境）
  # hostPath:
  #   path: /data/locust-manager/uploads
  #   type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: locust-manager-scripts-pv
  labels:
    app: locust-manager
    type: scripts
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: locust-manager-storage
  # 使用NFS存储
  nfs:
    server: your-nfs-server.local  # 请更改为您的NFS服务器地址
    path: /data/locust-manager/scripts
  # 或者使用hostPath
  # hostPath:
  #   path: /data/locust-manager/scripts
  #   type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: locust-manager-logs-pv
  labels:
    app: locust-manager
    type: logs
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: locust-manager-storage
  # 使用NFS存储
  nfs:
    server: your-nfs-server.local  # 请更改为您的NFS服务器地址
    path: /data/locust-manager/logs
  # 或者使用hostPath
  # hostPath:
  #   path: /data/locust-manager/logs
  #   type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: locust-manager-uploads-pvc
  namespace: locust-manager
  labels:
    app: locust-manager
    type: uploads
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: locust-manager-storage
  selector:
    matchLabels:
      app: locust-manager
      type: uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: locust-manager-scripts-pvc
  namespace: locust-manager
  labels:
    app: locust-manager
    type: scripts
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: locust-manager-storage
  selector:
    matchLabels:
      app: locust-manager
      type: scripts
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: locust-manager-logs-pvc
  namespace: locust-manager
  labels:
    app: locust-manager
    type: logs
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: locust-manager-storage
  selector:
    matchLabels:
      app: locust-manager
      type: logs
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: locust-manager-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain