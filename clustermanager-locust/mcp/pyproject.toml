[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locust-mcp-server"
version = "1.0.0"
description = "MCP Server for Locust Stress Test Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Chief Team"}
]
keywords = ["mcp", "locust", "stress-test", "load-test"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "anyio>=4.0.0",
]

[project.scripts]
locust-mcp-server = "locust_mcp_server:main"

[project.urls]
Homepage = "https://github.com/chief/chief-stresstest-locust"
Repository = "https://github.com/chief/chief-stresstest-locust"

[tool.hatch.build.targets.wheel]
packages = ["."]
