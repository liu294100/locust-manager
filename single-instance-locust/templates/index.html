<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locust 多实例压测管理界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .instances-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .instance-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border-left: 5px solid #007bff;
            transition: transform 0.2s ease;
        }
        
        .instance-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .instance-running {
            border-left-color: #4CAF50;
            background: #e8f5e8;
        }
        
        .instance-stopped {
            border-left-color: #f44336;
            background: #ffeaea;
        }
        
        .instance-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .instance-id {
            font-family: monospace;
            font-size: 0.9em;
            color: #666;
        }
        
        .instance-status {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .status-running {
            background: #4CAF50;
            color: white;
        }
        
        .status-stopped {
            background: #f44336;
            color: white;
        }
        
        .instance-info {
            margin-bottom: 15px;
        }
        
        .instance-info p {
            margin: 5px 0;
            font-size: 0.9em;
        }
        
        .instance-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .status-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 5px solid #4CAF50;
        }
        
        .status-running {
            border-left-color: #4CAF50;
            background: #e8f5e8;
        }
        
        .status-stopped {
            border-left-color: #f44336;
            background: #ffeaea;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .btn-start {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }
        
        .btn-start:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(76, 175, 80, 0.4);
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            color: white;
        }
        
        .btn-stop:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(244, 67, 54, 0.4);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0, 123, 255, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        
        .btn-large {
            padding: 15px 30px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .locust-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        
        .locust-link:hover {
            background: #0056b3;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .file-management {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 5px solid #007bff;
        }
        
        .file-upload-area {
            border: 2px dashed #007bff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .file-upload-area:hover {
            background: #f0f8ff;
        }
        
        .file-upload-area.dragover {
            background: #e3f2fd;
            border-color: #1976d2;
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .upload-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0, 123, 255, 0.3);
        }
        
        .file-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e1e5e9;
            border-radius: 5px;
            padding: 10px;
        }
        
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .file-item:last-child {
            border-bottom: none;
        }
        
        .file-name {
            flex: 1;
            font-family: monospace;
            color: #333;
        }
        
        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .delete-btn:hover {
            background: #c82333;
        }
        
        .hidden {
            display: none;
        }
        
        /* 搜索下拉框样式 */
        .searchable-select {
            position: relative;
            width: 100%;
        }
        
        .search-input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            background: white;
            cursor: pointer;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #4CAF50;
            cursor: text;
        }
        
        .search-input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }
        
        .dropdown-arrow {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #666;
            font-size: 12px;
            transition: transform 0.3s ease;
        }
        
        .searchable-select.open .dropdown-arrow {
            transform: translateY(-50%) rotate(180deg);
        }
        
        .dropdown-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #e1e5e9;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .searchable-select.open .dropdown-options {
            display: block;
        }
        
        .option {
            padding: 12px 15px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .option:last-child {
            border-bottom: none;
        }
        
        .option:hover {
            background-color: #f8f9fa;
        }
        
        .option.selected {
            background-color: #4CAF50;
            color: white;
        }
        
        .option.hidden {
            display: none;
        }
        
        .no-results {
            padding: 12px 15px;
            color: #666;
            font-style: italic;
            text-align: center;
        }
        
        .search-select .options .option:hover {
            background-color: #f0f0f0;
        }

        /* 树形控件样式 */
        .script-tree-container {
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            background: white;
            overflow: hidden;
        }

        .tree-search {
            position: relative;
            border-bottom: 1px solid #e1e5e9;
        }

        .tree-search-input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            border: none;
            font-size: 14px;
            background: #f8f9fa;
            outline: none;
        }

        .tree-search-input:focus {
            background: white;
        }

        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
            font-size: 16px;
            padding: 4px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .search-clear:hover {
            background: #e9ecef;
            color: #495057;
        }

        .tree-view {
            max-height: 300px;
            overflow-y: auto;
            padding: 8px 0;
        }

        .tree-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #6c757d;
            gap: 12px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #e9ecef;
            border-top: 2px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tree-node {
            user-select: none;
        }

        .tree-folder {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-weight: 500;
        }

        .tree-folder:hover {
            background-color: #f8f9fa;
        }

        .tree-folder.expanded {
            background-color: #e8f5e8;
        }

        .tree-folder-icon {
            margin-right: 8px;
            font-size: 12px;
            transition: transform 0.2s ease;
            color: #6c757d;
        }

        .tree-folder.expanded .tree-folder-icon {
            transform: rotate(90deg);
        }

        .tree-folder-name {
            color: #495057;
        }

        .tree-children {
            display: none;
            margin-left: 20px;
        }

        .tree-folder.expanded + .tree-children {
            display: block;
        }

        .tree-file {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 20px;
        }

        .tree-file:hover {
            background-color: #f8f9fa;
        }

        .tree-file.selected {
            background-color: #4CAF50;
            color: white;
        }

        .tree-file-icon {
            margin-right: 8px;
            color: #4CAF50;
            font-size: 12px;
        }

        .tree-file.selected .tree-file-icon {
            color: white;
        }

        .tree-file-name {
            font-size: 14px;
        }

        .selected-script {
            padding: 12px 16px;
            background: #f8f9fa;
            border-top: 1px solid #e1e5e9;
            font-size: 13px;
        }

        .selected-label {
            color: #6c757d;
            margin-right: 8px;
        }

        .selected-path {
            color: #495057;
            font-weight: 500;
        }

        .tree-empty {
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-style: italic;
        }

        .tree-no-results {
            padding: 20px;
            text-align: center;
            color: #6c757d;
        }
        
        .search-select .options .option.selected {
            background-color: #007bff;
            color: white;
        }
        
        .search-select .options .no-results {
            padding: 8px 12px;
            color: #666;
            font-style: italic;
            text-align: center;
        }
        
        .search-select input:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div>
                    <h1 style="margin: 0;">🚀 Locust 多实例压测管理</h1>
                </div>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <span style="color: rgba(255,255,255,0.9); font-size: 14px;">
                        👤 {{ current_user.username }}
                    </span>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="logout()" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white;">
                        🚪 退出
                    </button>
                </div>
            </div>
            <p style="margin: 0;">同时管理多个压测实例，支持并行测试</p>
        </div>
        
        <div class="content">
            <!-- 总体状态显示 -->
            <div class="status-card" id="overallStatus">
                <h3>总体状态</h3>
                <p id="statusSummary">
                    当前运行实例: <span id="runningCount">0</span> 个 | 
                    运行总数记录: <span id="totalCount">0</span> 个
                </p>
                <div style="margin-top: 15px;">
                    <button type="button" class="btn btn-stop btn-sm" onclick="stopAllInstances()">
                        🛑 停止所有实例
                    </button>
                </div>
            </div>
            
            <!-- 实例列表 -->
            <div id="instancesContainer">
                <h3>压测实例</h3>
                <div class="instances-grid" id="instancesGrid">
                    <div id="noInstances" style="text-align: center; color: #666; grid-column: 1 / -1;">
                        暂无运行的实例
                    </div>
                </div>
            </div>
            
            <!-- 文件管理区域 -->
            <div class="file-management">
                <h3>📁 临时脚本管理</h3>
                
                <!-- 文件上传区域 -->
                <div class="file-upload-area" id="uploadArea">
                    <p>📤 拖拽Python文件到此处或点击选择文件</p>
                    <input type="file" id="fileInput" accept=".py" class="hidden">
                    <button type="button" class="upload-btn" onclick="document.getElementById('fileInput').click()">
                        选择文件
                    </button>
                </div>
                
                <!-- 临时文件列表 -->
                <div>
                    <h4>临时文件列表</h4>
                    <div class="file-list" id="fileList">
                        <p id="noFiles" style="text-align: center; color: #666;">暂无临时文件</p>
                    </div>
                </div>
            </div>
            
            <!-- 消息提示 -->
            <div id="alertSuccess" class="alert alert-success"></div>
            <div id="alertError" class="alert alert-error"></div>
            
            <!-- 加载动画 -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>处理中...</p>
            </div>
            
            <!-- 启动新实例表单 -->
            <div class="status-card" style="border-left-color: #007bff;">
                <h3>🚀 启动新压测实例</h3>
                <form id="locustForm">
                    <div class="form-group">
                        <label for="script_selection">选择脚本文件 *</label>
                        <div class="script-tree-container">
                            <div class="tree-search">
                                <input type="text" id="treeSearch" placeholder="搜索脚本文件..." class="tree-search-input">
                                <div class="search-clear" id="searchClear" style="display: none;">✕</div>
                            </div>
                            <div class="tree-view" id="scriptTree">
                                <div class="tree-loading">
                                    <div class="spinner"></div>
                                    <span>加载目录结构...</span>
                                </div>
                            </div>
                            <div class="selected-script" id="selectedScript">
                                <span class="selected-label">已选择:</span>
                                <span class="selected-path" id="selectedPath">请选择脚本文件</span>
                            </div>
                            <input type="hidden" id="script_directory" name="script_directory" required>
                            <input type="hidden" id="script_file" name="script_file" required>
                            <input type="hidden" id="script_full_path" name="script_full_path" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="target_host">目标主机 (可选)</label>
                        <input type="url" id="target_host" name="target_host" value="https://api.test.stx365.com/"
                           placeholder="http://example.com:8080" 
                           title="留空则在Locust Web UI中设置">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="users">用户数 (可选)</label>
                        <input type="number" id="users" name="users" min="1" 
                               placeholder="10" title="留空使用Web UI模式">
                    </div>
                    
                    <div class="form-group">
                        <label for="spawn_rate">生成速率 (用户/秒)</label>
                        <input type="number" id="spawn_rate" name="spawn_rate" min="1" 
                               placeholder="1" title="每秒启动的用户数">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="run_time">运行时间 (可选)</label>
                    <input type="text" id="run_time" name="run_time" 
                           placeholder="30s, 5m, 1h" 
                           title="例如: 30s, 5m, 1h, 留空则持续运行">
                </div>
                
                    <div class="button-group">
                        <button type="submit" class="btn btn-start btn-large" id="startBtn">
                            🚀 启动新实例
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 页面元素
        const form = document.getElementById('locustForm');
        const startBtn = document.getElementById('startBtn');
        const alertSuccess = document.getElementById('alertSuccess');
        const alertError = document.getElementById('alertError');
        const loading = document.getElementById('loading');
        const instancesGrid = document.getElementById('instancesGrid');
        const noInstances = document.getElementById('noInstances');
        const runningCount = document.getElementById('runningCount');
        const totalCount = document.getElementById('totalCount');
        
        // 树形控件元素
        const scriptTreeContainer = document.getElementById('scriptTreeContainer');
        const treeSearchInput = document.getElementById('treeSearchInput');
        const scriptTreeView = document.getElementById('scriptTreeView');
        const selectedScriptPath = document.getElementById('selectedScriptPath');
        const scriptFileHidden = document.getElementById('script_file');
        
        // 文件管理元素
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const fileList = document.getElementById('fileList');
        const noFiles = document.getElementById('noFiles');
        
        // 实例数据
        let instances = {};
        
        // 显示消息
        function showMessage(message, isError = false) {
            hideMessages();
            const alertElement = isError ? alertError : alertSuccess;
            alertElement.textContent = message;
            alertElement.style.display = 'block';
            
            // 3秒后自动隐藏
            setTimeout(hideMessages, 3000);
        }
        
        // 隐藏消息
        function hideMessages() {
            alertSuccess.style.display = 'none';
            alertError.style.display = 'none';
        }
        
        // 显示/隐藏加载动画
        function showLoading(show = true) {
            loading.style.display = show ? 'block' : 'none';
            startBtn.disabled = show;
        }
        
        // 刷新实例列表
        async function refreshInstances() {
            try {
                const response = await fetch('/api/instances');
                const data = await response.json();
                
                // 将数组转换为以实例ID为键的对象
                const instancesArray = data.instances || [];
                instances = {};
                instancesArray.forEach(instance => {
                    instances[instance.instance_id] = instance;
                });
                
                updateInstancesDisplay();
                updateStatusSummary();
            } catch (error) {
                console.error('刷新实例失败:', error);
                showMessage('刷新实例失败: ' + error.message, true);
            }
        }
        
        // 更新实例显示
        function updateInstancesDisplay() {
            const instanceIds = Object.keys(instances);
            // 只显示运行中的实例
            const runningInstanceIds = instanceIds.filter(id => instances[id].is_running);
            
            if (runningInstanceIds.length === 0) {
                noInstances.style.display = 'block';
                instancesGrid.innerHTML = '<div id="noInstances" style="text-align: center; color: #666; grid-column: 1 / -1;">暂无运行的实例</div>';
                return;
            }
            
            noInstances.style.display = 'none';
            instancesGrid.innerHTML = '';
            
            runningInstanceIds.forEach(instanceId => {
                const instance = instances[instanceId];
                const instanceCard = createInstanceCard(instanceId, instance);
                instancesGrid.appendChild(instanceCard);
            });
        }
        
        // 创建实例卡片
        function createInstanceCard(instanceId, instance) {
            const card = document.createElement('div');
            card.className = `instance-card ${instance.is_running ? 'instance-running' : 'instance-stopped'}`;
            
            const shortId = instanceId.substring(0, 8);
            const statusClass = instance.is_running ? 'status-running' : 'status-stopped';
            const statusText = instance.is_running ? '运行中' : '已停止';
            
            // 创建基本结构
            card.innerHTML = `
                <div class="instance-header">
                    <div class="instance-id">ID: ${shortId}</div>
                    <div class="instance-status ${statusClass}">${statusText}</div>
                </div>
                <div class="instance-info">
                    <p><strong>端口:</strong> ${instance.port}</p>
                    <p><strong>脚本:</strong> ${instance.script_file || '未知'}</p>
                    <p><strong>目标:</strong> ${instance.target_host || '未设置'}</p>
                    ${instance.is_running ? `<p><strong>PID:</strong> ${instance.pid}</p>` : ''}
                </div>
                <div class="instance-actions">
                </div>
            `;
            
            // 单独创建动作按钮
            const actionsDiv = card.querySelector('.instance-actions');
            
            if (instance.is_running) {
                // 创建打开Web UI链接
                const webUILink = document.createElement('a');
                webUILink.href = `/proxy/${instanceId}/`;
                webUILink.target = '_blank';
                webUILink.className = 'btn btn-primary btn-sm';
                webUILink.textContent = '🎯 打开Web UI';
                actionsDiv.appendChild(webUILink);
                
                // 创建停止按钮
                const stopBtn = document.createElement('button');
                stopBtn.className = 'btn btn-stop btn-sm';
                stopBtn.textContent = '⏹️ 停止';
                stopBtn.onclick = () => stopInstance(instanceId);
                actionsDiv.appendChild(stopBtn);
            } else {
                // 创建移除按钮
                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn btn-secondary btn-sm';
                removeBtn.textContent = '🗑️ 移除';
                removeBtn.onclick = () => removeInstance(instanceId);
                actionsDiv.appendChild(removeBtn);
            }
            
            return card;
        }
        
        // 更新状态摘要
        function updateStatusSummary() {
            const instanceIds = Object.keys(instances);
            const runningInstances = instanceIds.filter(id => instances[id].is_running);
            
            runningCount.textContent = runningInstances.length;
            totalCount.textContent = instanceIds.length;
        }
        
        // 停止指定实例
        async function stopInstance(instanceId) {
            try {
                showLoading(true);
                const response = await fetch(`/api/stop/${instanceId}`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`实例 ${instanceId.substring(0, 8)} 已停止`);
                    await refreshInstances();
                } else {
                    showMessage(data.error || '停止实例失败', true);
                }
            } catch (error) {
                console.error('停止实例失败:', error);
                showMessage('停止实例失败: ' + error.message, true);
            } finally {
                showLoading(false);
            }
        }
        
        // 移除实例
        async function removeInstance(instanceId) {
            if (!confirm(`确定要移除实例 ${instanceId.substring(0, 8)} 吗？`)) {
                return;
            }
            
            try {
                showLoading(true);
                const response = await fetch(`/api/remove/${instanceId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`实例 ${instanceId.substring(0, 8)} 已移除`);
                    await refreshInstances();
                } else {
                    showMessage(data.error || '移除实例失败', true);
                }
            } catch (error) {
                console.error('移除实例失败:', error);
                showMessage('移除实例失败: ' + error.message, true);
            } finally {
                showLoading(false);
            }
        }
        
        // 停止所有实例
        async function stopAllInstances() {
            if (!confirm('确定要停止所有运行中的实例吗？')) {
                return;
            }
            
            try {
                showLoading(true);
                const response = await fetch('/api/stop_all', {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`已停止 ${data.stopped_count} 个实例`);
                    await refreshInstances();
                } else {
                    showMessage(data.error || '停止所有实例失败', true);
                }
            } catch (error) {
                console.error('停止所有实例失败:', error);
                showMessage('停止所有实例失败: ' + error.message, true);
            } finally {
                showLoading(false);
            }
        }
        
        // 清理停止的实例
        async function cleanupInstances() {
            try {
                showLoading(true);
                const response = await fetch('/api/cleanup', {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`已清理 ${data.cleaned_count} 个停止的实例`);
                    await refreshInstances();
                } else {
                    showMessage(data.error || '清理实例失败', true);
                }
            } catch (error) {
                console.error('清理实例失败:', error);
                showMessage('清理实例失败: ' + error.message, true);
            } finally {
                showLoading(false);
            }
        }
        
        // 启动新实例
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            showLoading(true);
            
            // 收集表单数据
            const formData = new FormData(form);
            const data = {};
            for (let [key, value] of formData.entries()) {
                data[key] = value;
            }
            
            try {
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(`新实例已启动！实例ID: ${result.instance_id.substring(0, 8)}, 端口: ${result.port}`);
                    // 刷新实例列表
                    await refreshInstances();
                    // 重置表单
                    form.reset();
                } else {
                    showMessage(result.message || '启动实例失败', true);
                }
            } catch (error) {
                console.error('启动实例失败:', error);
                showMessage('启动实例失败: ' + error.message, true);
            } finally {
                showLoading(false);
            }
        });
        
        // 加载目录列表
        function loadDirectories() {
            fetch('/api/directories')
                .then(response => response.json())
                .then(data => {
                    // 更新搜索下拉框的选项
                    const options = [{value: '', text: '请选择目录'}];
                    data.directories.forEach(dir => {
                        options.push({value: dir, text: dir});
                    });
                    
                    directorySelect.updateOptions(options);
                    
                    // 重置脚本选择
                    scriptSelect.reset();
                    scriptSelect.setDisabled(true);
                })
                .catch(error => {
                    console.error('Error loading directories:', error);
                    showMessage('加载目录失败: ' + error.message, 'error');
                });
        }
        
        // 树形控件相关变量
        let treeData = null;
        let selectedScript = null;
        let filteredNodes = [];

        // 初始化树形控件
        async function initScriptTree() {
            const treeView = document.getElementById('scriptTree');
            const searchInput = document.getElementById('treeSearch');
            const searchClear = document.getElementById('searchClear');
            
            // 加载目录树数据
            await loadDirectoryTree();
            
            // 绑定搜索功能
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.trim();
                if (searchTerm) {
                    searchClear.style.display = 'block';
                    filterTree(searchTerm);
                } else {
                    searchClear.style.display = 'none';
                    renderTree(treeData);
                }
            });
            
            // 绑定清除搜索
            searchClear.addEventListener('click', function() {
                searchInput.value = '';
                this.style.display = 'none';
                renderTree(treeData);
            });
        }

        // 加载目录树数据
        async function loadDirectoryTree() {
            const treeView = document.getElementById('scriptTree');
            
            try {
                const response = await fetch('/api/directory-tree');
                const data = await response.json();
                
                if (data.success && data.tree) {
                    treeData = data.tree;
                    renderTree(treeData);
                } else {
                    treeView.innerHTML = '<div class="tree-empty">加载目录结构失败</div>';
                }
            } catch (error) {
                console.error('加载目录树失败:', error);
                treeView.innerHTML = '<div class="tree-empty">加载目录结构失败</div>';
            }
        }

        // 渲染树形结构
        function renderTree(data) {
            const treeView = document.getElementById('scriptTree');
            
            if (!data || !Array.isArray(data) || data.length === 0) {
                treeView.innerHTML = '<div class="tree-empty">没有找到脚本文件</div>';
                return;
            }
            
            let html = '';
            
            // 遍历数组中的每个项目，过滤掉__pycache__目录
            data.forEach(item => {
                if (item.type === 'directory') {
                    // 过滤掉__pycache__目录
                    if (item.name !== '__pycache__') {
                        html += renderDirectoryNode(item, '');
                    }
                } else if (item.type === 'file') {
                    html += renderFileNode(item.name, '');
                }
            });
            
            treeView.innerHTML = html;
            
            // 绑定事件
            bindTreeEvents();
        }

        // 渲染目录节点
        function renderDirectoryNode(directory, parentPath) {
            // 使用实际路径而不是显示名称
            const actualPath = directory.path || directory.name;
            const fullPath = parentPath ? `${parentPath}/${actualPath}` : actualPath;
            let html = `
                <div class="tree-node">
                    <div class="tree-folder" data-path="${fullPath}">
                        <span class="tree-folder-icon">▶</span>
                        <span class="tree-folder-name">${directory.name}</span>
                    </div>
                    <div class="tree-children">
            `;
            
            // 渲染子项目，过滤掉__pycache__目录
            if (directory.children && directory.children.length > 0) {
                directory.children.forEach(child => {
                    if (child.type === 'directory') {
                        // 过滤掉__pycache__目录
                        if (child.name !== '__pycache__') {
                            html += renderDirectoryNode(child, fullPath);
                        }
                    } else if (child.type === 'file') {
                        html += renderFileNode(child.name, fullPath);
                    }
                });
            }
            
            html += '</div></div>';
            return html;
        }

        // 渲染文件节点
        function renderFileNode(file, parentPath) {
            const fullPath = parentPath ? `${parentPath}/${file}` : file;
            return `
                <div class="tree-file" data-file="${file}" data-directory="${parentPath}" data-full-path="${fullPath}">
                    <span class="tree-file-icon">🐍</span>
                    <span class="tree-file-name">${file}</span>
                </div>
            `;
        }

        // 绑定树形控件事件
        function bindTreeEvents() {
            const treeView = document.getElementById('scriptTree');
            
            // 目录展开/收起
            treeView.addEventListener('click', function(e) {
                if (e.target.closest('.tree-folder')) {
                    const folder = e.target.closest('.tree-folder');
                    const children = folder.nextElementSibling;
                    
                    if (folder.classList.contains('expanded')) {
                        folder.classList.remove('expanded');
                        children.style.display = 'none';
                    } else {
                        folder.classList.add('expanded');
                        children.style.display = 'block';
                    }
                }
                
                // 文件选择
                if (e.target.closest('.tree-file')) {
                    const fileNode = e.target.closest('.tree-file');
                    selectScriptFile(fileNode);
                }
            });
        }

        // 选择脚本文件
        function selectScriptFile(fileNode) {
            // 移除之前的选中状态
            document.querySelectorAll('.tree-file.selected').forEach(node => {
                node.classList.remove('selected');
            });
            
            // 设置新的选中状态
            fileNode.classList.add('selected');
            
            // 获取文件信息
            const fileName = fileNode.dataset.file;
            const directory = fileNode.dataset.directory || '';
            const fullPath = fileNode.dataset.fullPath;
            
            // 更新隐藏字段
            document.getElementById('script_file').value = fileName;
            document.getElementById('script_directory').value = directory;
            document.getElementById('script_full_path').value = fullPath;
            
            // 更新显示的选中路径
            document.getElementById('selectedPath').textContent = fullPath;
            
            // 保存选中的脚本信息
            selectedScript = {
                file: fileName,
                directory: directory,
                fullPath: fullPath
            };
        }

        // 搜索过滤树形结构
        function filterTree(searchTerm) {
            const treeView = document.getElementById('scriptTree');
            
            if (!treeData || !Array.isArray(treeData)) {
                return;
            }
            
            const matchedFiles = [];
            
            // 递归搜索文件
            function searchInNode(node, parentPath = '') {
                // 过滤掉__pycache__目录
                if (node.type === 'directory' && node.name === '__pycache__') {
                    return;
                }
                
                const currentPath = parentPath ? `${parentPath}/${node.name}` : node.name;
                
                if (node.type === 'file') {
                    // 如果是文件，检查是否匹配搜索词
                    if (node.name.toLowerCase().includes(searchTerm.toLowerCase())) {
                        matchedFiles.push({
                            file: node.name,
                            directory: parentPath,
                            fullPath: currentPath
                        });
                    }
                } else if (node.type === 'directory' && node.children) {
                    // 如果是目录，递归搜索子项目
                    node.children.forEach(child => {
                        searchInNode(child, currentPath);
                    });
                }
            }
            
            // 搜索所有节点，过滤掉__pycache__目录
            treeData.forEach(node => {
                if (node.type !== 'directory' || node.name !== '__pycache__') {
                    searchInNode(node);
                }
            });
            
            // 渲染搜索结果
            if (matchedFiles.length > 0) {
                let html = '';
                matchedFiles.forEach(match => {
                    html += `
                        <div class="tree-file" data-file="${match.file}" data-directory="${match.directory}" data-full-path="${match.fullPath}">
                            <span class="tree-file-icon">🐍</span>
                            <span class="tree-file-name">${match.file}</span>
                            <small style="color: #6c757d; margin-left: 8px;">${match.fullPath}</small>
                        </div>
                    `;
                });
                treeView.innerHTML = html;
            } else {
                treeView.innerHTML = '<div class="tree-no-results">没有找到匹配的脚本文件</div>';
            }
            
            // 重新绑定事件
            bindTreeEvents();
        }

        // 级联下拉逻辑
        async function loadScriptsForDirectory(directory) {
            if (!directory) {
                scriptSelect.updateOptions([{value: '', text: '请先选择目录...'}]);
                scriptSelect.setDisabled(true);
                return;
            }
            
            try {
                const response = await fetch(`/api/scripts/${encodeURIComponent(directory)}`);
                const data = await response.json();
                
                if (data.scripts && data.scripts.length > 0) {
                    const options = [{value: '', text: '请选择脚本...'}];
                    data.scripts.forEach(script => {
                        options.push({value: script, text: script});
                    });
                    scriptSelect.updateOptions(options);
                    scriptSelect.setDisabled(false);
                } else {
                    scriptSelect.updateOptions([{value: '', text: '该目录下没有脚本文件'}]);
                    scriptSelect.setDisabled(true);
                }
            } catch (error) {
                console.error('加载脚本列表失败:', error);
                scriptSelect.updateOptions([{value: '', text: '加载失败'}]);
                scriptSelect.setDisabled(true);
            }
        }


        
        // 文件上传功能
        async function uploadFile(file) {
            if (!file.name.endsWith('.py')) {
                showMessage('只能上传.py文件', true);
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                showLoading(true);
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(result.message);
                    // 延迟刷新页面，让用户看到成功消息
                    setTimeout(() => {
                        window.location.reload();
                    }, 1500);
                } else {
                    showMessage(result.message, true);
                }
            } catch (error) {
                showMessage('上传失败: ' + error.message, true);
            } finally {
                showLoading(false);
            }
        }
        
        // 删除文件功能
        async function deleteFile(filename) {
            if (!confirm(`确定要删除文件 ${filename} 吗？`)) {
                return;
            }
            
            try {
                showLoading(true);
                const response = await fetch('/api/delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ filename: filename })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(result.message);
                    // 延迟刷新页面，让用户看到成功消息
                    setTimeout(() => {
                        window.location.reload();
                    }, 1500);
                } else {
                    showMessage(result.message, true);
                }
            } catch (error) {
                showMessage('删除失败: ' + error.message, true);
            } finally {
                showLoading(false);
            }
        }
        
        // 加载临时文件列表
        async function loadTempFiles() {
            try {
                const response = await fetch('/api/scripts/tmp');
                const data = await response.json();
                
                fileList.innerHTML = '';
                
                if (data.scripts && data.scripts.length > 0) {
                    data.scripts.forEach(script => {
                        const fileItem = document.createElement('div');
                        fileItem.className = 'file-item';
                        fileItem.innerHTML = `
                            <span class="file-name">${script}</span>
                            <button class="delete-btn" onclick="deleteFile('${script}')">删除</button>
                        `;
                        fileList.appendChild(fileItem);
                    });
                } else {
                    fileList.appendChild(noFiles);
                }
            } catch (error) {
                console.error('加载临时文件列表失败:', error);
            }
        }
        
        // 文件选择事件
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                uploadFile(file);
            }
            // 清空input，允许重复上传同一文件
            this.value = '';
        });
        
        // 拖拽上传功能
        uploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                uploadFile(files[0]);
            }
        });

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', async function() {
            // 初始化树形控件
            initScriptTree();
            
            // 加载临时文件列表
            loadTempFiles();
            
            // 初始化实例列表
            await refreshInstances();
            
            // 绑定全局按钮事件
            const stopAllBtn = document.getElementById('stopAllBtn');
            const cleanupBtn = document.getElementById('cleanupBtn');
            
            if (stopAllBtn) {
                stopAllBtn.addEventListener('click', stopAllInstances);
            }
            
            if (cleanupBtn) {
                cleanupBtn.addEventListener('click', cleanupInstances);
            }
        });
        
        // 退出登录功能
        async function logout() {
            if (!confirm('确定要退出登录吗？')) {
                return;
            }
            
            try {
                showLoading(true);
                const response = await fetch('/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('已成功退出登录');
                    // 延迟跳转，让用户看到成功消息
                    setTimeout(() => {
                        window.location.href = result.redirect;
                    }, 1000);
                } else {
                    showMessage('退出失败: ' + result.message, true);
                }
            } catch (error) {
                showMessage('退出失败: ' + error.message, true);
            } finally {
                showLoading(false);
            }
        }
        
        // 定期刷新实例状态
        setInterval(async () => {
            try {
                await refreshInstances();
            } catch (error) {
                console.error('定期刷新实例失败:', error);
            }
        }, 5000);
    </script>
